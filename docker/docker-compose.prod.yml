services:
  app-queue-consumer:
    depends_on:
      - redis
    deploy:
      rollback_config:
        order: start-first
      update_config:
        order: start-first
    env_file:
      - ./app/.env
      - ./app/.env.local
    image: ghcr.io/buzzingpixel/site-backups-queue-consumer
    extra_hosts:
      - "buzzingpixel-hetzner-docker:100.89.248.3"
      - "smrc-hetzner-docker:100.82.195.58"
    environment:
      HOSTNAME: buzzingpixel-site-backups-queue-consumer
    volumes:
      - type: bind
        source: /Users/tj/.ssh/id_rsa
        target: /root/.ssh/id_rsa
      - type: bind
        source: /Users/tj/.ssh/id_rsa.pub
        target: /root/.ssh/id_rsa.pub
      - type: bind
        source: /Volumes/ivy-ext-01/site-backups
        target: /storage

  app-schedule-runner:
    depends_on:
      - redis
    deploy:
      rollback_config:
        order: start-first
      update_config:
        order: start-first
    env_file:
      - ./app/.env
      - ./app/.env.local
    image: ghcr.io/buzzingpixel/site-backups-schedule-runner
    extra_hosts:
      - "buzzingpixel-hetzner-docker:100.89.248.3"
      - "smrc-hetzner-docker:100.82.195.58"
    environment:
      HOSTNAME: buzzingpixel-site-backups-schedule-runner
    volumes:
      - type: bind
        source: /Users/tj/.ssh/id_rsa
        target: /root/.ssh/id_rsa
      - type: bind
        source: /Users/tj/.ssh/id_rsa.pub
        target: /root/.ssh/id_rsa.pub
      - type: bind
        source: /Volumes/ivy-ext-01/site-backups
        target: /storage

  redis:
    image: redis
    volumes:
      - redis-volume:/data
      # Redis does not use this mount. It exists so the redis task shares the
      # same dependency on the external backup drive as the app services, so it
      # won't start (and register swarm DNS) during the early-boot window before
      # /Volumes/ivy-ext-01 is mounted. On the Jul 2026 reboot, redis started
      # ahead of the still-flapping app tasks and ended up Up but unresolvable by
      # service name; gating it on the same mount keeps all three converging
      # together after the drive is available.
      - type: bind
        source: /Volumes/ivy-ext-01/site-backups
        target: /storage
        read_only: true
    networks:
      default:
        aliases:
          - buzzingpixel-site-backups-redis

volumes:
  redis-volume:
